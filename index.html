async function fetchGames(){const G={},errs=[];
 try{const SBC={};for(const v of Object.values(CFB)){const dt=v[2]||"20261017";if(!SBC[dt])SBC[dt]=getJSON(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=${dt}&limit=300&groups=80`,"ESPN");}

const pkey=d=>d.toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"});

function setDay(t){if(!["DEAD","CASHED","PUSH"].includes(t.roll))return null;if(t.settled)return t.settled;
